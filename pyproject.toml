[project]
name = "polaritics"
version = "0.1.0"
description = "Posição política de parlamentares a partir de dados oficiais de votação"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyarrow>=17",
]

[project.scripts]
polaritics = "polaritics.cli:main"

[project.optional-dependencies]
modelo = [
    "jax>=0.4.30",
    "numpyro>=0.15",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
